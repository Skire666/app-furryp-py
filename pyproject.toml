[project]
name = "furryp"
version = "1.0.2"
description = "A local, dependency-free Python linter inspired by ruff."
readme = "README.md"
requires-python = ">=3.14"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "skire666" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
furryp = "furryp.cli.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]

# Set on purpose: the line counts of function-too-long and file-too-long depend on it.
line-length = 120

# ruff only looks at furryp/: the other folders are ignored.
# pyproject.toml stays linted by ruff check; ruff format skips it.
include = ["furryp/**/*.py", "furryp/**/*.md", "pyproject.toml"]

# Deliberately faulty samples used by the tests.
extend-exclude = ["tests/**"]

[tool.ruff.format]

# use double quote tyhan simple quote
quote-style = "double"

# indent with spaces, rather than tabs.
indent-style = "space"

# avoid useless new line after comma
skip-magic-trailing-comma = true

# "auto" | "lf" | "crlf" | "cr" | "native"
line-ending = "lf"

[tool.ruff.lint]

# List of rule families to enable.

select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "ERA",  # eradicate
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PLC",  # pylint convention
    "PLE",  # pylint error
    "PLR",  # pylint refactor
    "PLW",  # pylint warning
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

# Activate preview
preview = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]

# The formatter ignores magic trailing commas (skip-magic-trailing-comma): isort must too.
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]

# Alert if cyclomatic complexity exceeds this threshold.
# 10 is the widely accepted standard (McCabe's own recommendation).
# 1-5: simple | 6-10: acceptable | 11-15: refactor | 15+: high bug risk
max-complexity = 9 # 9 recommanded

[tool.ruff.lint.per-file-ignores]

"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]

# Enforce Google style for docstrings (Args:, Returns:, Raises:…).
# Other possible values: "numpy" or "pep257".
convention = "google"

[tool.ruff.lint.pylint]

# Maximum number of arguments for a function/method
max-args = 8  # default: 5

# Maximum number of positional arguments for a function/method
max-positional-args = 8  # default: same as max-args

# Maximum number of boolean expressions in a function/method
max-bool-expr = 8  # default: 5

# Maximum number of branches in a function/method (if, elif, else, for, while, try, except...)
max-branches = 12  # default: 12

# Maximum number of statements in the body of a function/method
max-statements = 35  # default: 50

# Maximum number of return statements in a function/method
max-returns = 8  # default: 6

# Maximum number of public methods for a class
max-public-methods = 25  # default: 20

# Maximum number of local variables in a function/method
max-locals = 12  # default: 15

# Maximum number of nested blocks
max-nested-blocks = 4  # default: 5

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
